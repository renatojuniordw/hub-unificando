# docker-compose para VPS — sem dependência dos repositórios irmãos.
#
# O conhecimento viaja DENTRO da imagem: o Dockerfile copia a knowledge lib
# commitada (`knowledge/<slug>`, gerada no dev com `npm run hub -- sync-docs`
# e commitada no git) para /app/knowledge. No primeiro boot o entrypoint roda
# migrate + seed + seed-categories e depois `hub ingest`, que lê da lib
# (KNOWLEDGE_LIB_ROOT=/app/knowledge). Para atualizar o índice: commit novo da
# lib + `docker compose -f docker-compose.prod.yml up -d --build` (o ingest é
# idempotente; também dá para reexecutar via exec).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: hub_unificando
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub_unificando']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '11020'
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD:-hub}@db:5432/hub_unificando
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'true'
      KNOWLEDGE_LIB_ROOT: /app/knowledge
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-base}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      EMBEDDING_CACHE_DIR: /data/.transformers-cache
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_ENABLE_JSON_RESPONSE: ${MCP_ENABLE_JSON_RESPONSE:-false}
      MCP_SESSION_TTL_MIN: ${MCP_SESSION_TTL_MIN:-60}
      MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:11020}
    ports:
      - '${HUB_PORT:-11020}:11020'
    volumes:
      # The committed knowledge lib is baked into the image; only the on-device
      # model cache needs to survive restarts.
      - transformers-cache:/data/.transformers-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:11020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 6

volumes:
  pgdata:
  redisdata:
  transformers-cache:
