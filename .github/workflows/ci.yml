name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://hub:hub@localhost:5432/hub_unificando
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test -- --ci

  integration:
    name: Integration (Testcontainers pgvector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration -- --ci

  ingest-smoke:
    name: Ingest smoke (modelo real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_unificando
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub -d hub_unificando"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: node --import tsx prisma/seed.ts
      - run: npm run build
      # Monta o ecossistema em /tmp/ecosystem (clona um projeto irmão) e
      # ingere com o modelo real (multilingual-e5-base) como smoke.
      - name: Clone sibling project
        run: |
          mkdir -p /tmp/ecosystem
          git clone --depth 1 https://github.com/renatojuniordw/ui-unificando.git /tmp/ecosystem/ui-unificando
          # Empty knowledge lib: the smoke must ingest from the fresh sibling
          # clone above (resolution falls back to HUB_SCAN_ROOT), not from the
          # committed knowledge/ folder baked into this repo.
          mkdir -p /tmp/knowledge-lib-empty
      - name: Smoke ingestion (real model)
        run: node dist/scripts/smoke-ingest.js ui-unificando
        env:
          HUB_SCAN_ROOT: /tmp/ecosystem
          KNOWLEDGE_LIB_ROOT: /tmp/knowledge-lib-empty
          EMBEDDING_CACHE_DIR: /tmp/.transformers-cache
      - name: Registry status
        run: node dist/src/cli.js status

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Audit de segurança: falha em qualquer vulnerabilidade NOVA com
      # correção real aplicável (fix sem breaking change). São aceitas:
      # 1) vulnerabilidades sem correção alguma (`fixAvailable: false`) e
      # 2) vulnerabilidades cujo único "fix" é um rebaixamento/forcing de
      # major (isSemVerMajor) — o npm sugere prisma@6.19.3 (7 -> 6,
      # breaking, inaplicável). Roots atuais: GHSA-xcpc-8h2w-3j85
      # (adm-zip, via onnxruntime-node do @huggingface/transformers),
      # GHSA-ggr8-5vv4-36mx (deepmerge-ts, via @prisma/config),
      # GHSA-f88m-g3jw-g9cj (sharp/libvips) e GHSA do mysql2 (inativo: o
      # projeto usa Postgres/pgvector, nunca MySQL). Monitorar e reavaliar
      # quando o upstream publicar correção real.
      - name: Security audit (falha em vulnerabilidade nova corrigível)
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e '
            const a = require("/tmp/audit.json");
            const entries = Object.entries(a.vulnerabilities || {});
            const semFix = entries.filter(([, v]) => !v.fixAvailable || v.fixAvailable === false);
            const comFix = entries.filter(([, v]) => v.fixAvailable && v.fixAvailable !== false && !v.fixAvailable.isSemVerMajor);
            if (semFix.length) {
              console.log("Vulnerabilidades sem correcao aplicavel (aceitas, monitoradas):");
              for (const [k, v] of semFix) console.log("  -", k, "|", v.severity, "| fix:", JSON.stringify(v.fixAvailable));
            }
            if (comFix.length) {
              console.error("Vulnerabilidades com correcao real disponivel — acione o time:");
              for (const [k, v] of comFix) console.error("  -", k, "|", v.severity, "| fix:", JSON.stringify(v.fixAvailable));
              process.exit(1);
            }
            console.log(semFix.length ? "OK: apenas vulnerabilidades sem correcao aplicavel." : "OK: nenhuma vulnerabilidade.");
          '
